# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-car-ecu"
BBFILE_PATTERN_meta-car-ecu = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-car-ecu = "6"

LAYERDEPENDS_meta-car-ecu = "core"
LAYERSERIES_COMPAT_meta-car-ecu = "blacksail wrynose"
